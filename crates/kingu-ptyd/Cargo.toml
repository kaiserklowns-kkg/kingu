[package]
name = "kingu-ptyd"
version = "0.1.0"
description = "Kingu terminal host: owns PTY sessions so they outlive the app"
license = "MIT"
edition = "2024"
rust-version = "1.90"
publish = false

# The library holds the PTY sessions (also used in-process by the app when the daemon is
# unavailable) and the daemon's protocol, server and client; the binary is the daemon.
[lib]
name = "kingu_ptyd"
path = "src/lib.rs"

[[bin]]
name = "kingu-ptyd"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
