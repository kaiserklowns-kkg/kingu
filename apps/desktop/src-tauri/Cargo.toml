[package]
name = "kingu-desktop"
version = "0.1.0"
description = "Kingu desktop shell"
authors = ["Kingu"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kingu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.9.0"
tauri-plugin-dialog = "=2.8.1"
notify = "=8.2.0"
trash = "=5.2.9"
regex = "1"
# Team sync (src/team): token in the OS keychain, HTTPS via the system TLS stack.
keyring = "=4.2.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
