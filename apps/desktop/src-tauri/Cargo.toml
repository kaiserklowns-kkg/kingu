[package]
name = "kingu-desktop"
version = "0.1.0"
description = "Kingu desktop shell"
authors = ["Kingu"]
license = "Apache-2.0"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kingu_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# preserve_order: a CLI config Kingu edits (agent/trust.rs) keeps its key order.
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# Log line timestamps (src/logging.rs); already in the tree through tauri-plugin-log.
time = { version = "0.3", features = ["formatting", "macros"] }
# Terminal sessions: in the kingu-ptyd daemon (macOS, Linux) or in-process.
kingu-ptyd = { path = "../../../crates/kingu-ptyd" }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-notification = "=2.5.1"
notify = "=8.2.0"
trash = "=5.2.9"
regex = "1"
# Image viewer (fs_read_data_url): files as data: URLs.
base64 = "0.22.1"
# Team sync (src/team): token in the OS keychain, HTTPS via the system TLS stack.
keyring = "=4.2.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "native-tls", "socks"] }
url = "2.5.8"
# Snaps (src/snap.rs): snap.toml manifests, trust keyed by the manifest's SHA-256.
toml = "1.1.8"
sha2 = "0.10.9"
encoding_rs = "=0.8.42"
chardetng = "=1.0.0"
# The repository config file kingu.yaml (src/agent/kingu_yaml.rs): the event parser only, no encoding_rs.
yaml-rust2 = { version = "=0.13.0", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Agent notifications whose click opens the task (src/notify.rs); the plugin's own macOS backend.
[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
# Message boxes whose Cancel answers Escape (src/dialog.rs); the versions rfd already uses.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tempfile = "3"
